name: Rehearsal CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

# The CLI signs in to Rehearsal with this job's GitHub identity, as the repository
# connected to the project, so the workflow stores no Rehearsal secret.
permissions:
  id-token: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REHEARSAL_APP: ${{ vars.REHEARSAL_APP }}
    steps:
      - name: Check the repository settings
        run: |
          if [ -z "$REHEARSAL_APP" ]; then
            echo "::error::Set the repository variable REHEARSAL_APP, as the README shows."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The CLI needs Node 24.12 or later, and the runner's cached Node 24 can be older.
          check-latest: true
      - run: npm install -g @rehearsal-labs/cli

      # Production is whatever Vercel serves there when the step starts, which can be the commit
      # before this one for the minute Vercel takes to deploy it.
      - name: Run the app's tests on production
        run: |
          # With --json a refusal is written to start.json, so print it before failing.
          rehearsal runs start --app "$REHEARSAL_APP" --environment production \
            --idempotency-key "testbed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --json > start.json \
            || { status=$?; cat start.json; exit "$status"; }
          for run in $(jq -r '(.data.runs // [.data])[].runId' start.json); do
            rehearsal runs wait "$run" --timeout 30m
          done
